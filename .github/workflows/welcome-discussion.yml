name: Welcome discussion

# One-time: posts docs/welcome-discussion.md as a discussion in Announcements.
on:
  workflow_dispatch:

permissions:
  contents: read
  discussions: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the discussion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          owner="${GITHUB_REPOSITORY%/*}"; name="${GITHUB_REPOSITORY#*/}"
          ids="$(gh api graphql -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){id discussionCategories(first:20){nodes{id name}}}}' -f o="$owner" -f n="$name")"
          repo="$(echo "$ids" | jq -r .data.repository.id)"
          cat="$(echo "$ids" | jq -r '.data.repository.discussionCategories.nodes[] | select(.name=="Announcements") | .id')"
          gh api graphql -F query='mutation($r:ID!,$c:ID!,$t:String!,$b:String!){createDiscussion(input:{repositoryId:$r,categoryId:$c,title:$t,body:$b}){discussion{number url}}}' \
            -f r="$repo" -f c="$cat" -f t="Добро пожаловать в A-VPN: скачать, обсуждать, сообщать об ошибках" -f b="$(cat docs/welcome-discussion.md)" | jq -r .data.createDiscussion.discussion.url
